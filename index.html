<!doctype html>
<html lang="ko" data-theme="butter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생활도장</title>
<meta name="description" content="일기부터 음악감상까지, 열네 가지 생활을 기록하는 일지">
<meta name="theme-color" content="#FFF1C4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B2018" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생활도장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('saenghwal-theme')==='classic')document.documentElement.dataset.theme='classic'}catch(e){}</script>
<style>
:root{
  --paper:#EEF2FA; --grid:#DCE4F4; --sheet:#FBFCFF; --ink:#1B2450; --soft:#5A638A;
  --line:#C9D3EA; --blue:#2B3FD6; --on-blue:#fff; --danger:#C2253C;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161C36; --grid:#1F2747; --sheet:#1F2747; --ink:#EDF0FB; --soft:#A7B0D3;
  --line:#37416B; --blue:#9DA9FF; --on-blue:#141A33; --danger:#FF8FA0; color-scheme:dark;
}
.tint{--c:var(--cd)!important}}
:root[data-theme=butter]{
  --paper:#FFF1C4; --grid:#FFE9A8; --sheet:#FFFBEE; --ink:#57392A; --soft:#7D5F4A;
  --line:#F1DFAE; --blue:#6B4A32; --on-blue:#FFF8E4; --danger:#B23A2E;
}
@media (prefers-color-scheme:dark){:root[data-theme=butter]{
  --paper:#2B2018; --grid:#3A2C21; --sheet:#3A2C21; --ink:#FFF1CC; --soft:#D5BE9F;
  --line:#54422F; --blue:#FFD978; --on-blue:#3A2A1C; --danger:#FFA08F;
}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);color:var(--ink);line-height:1.6;font-size:16px;min-height:100dvh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3}
img{display:block;max-width:100%}

.app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-size:28px}
.top p{color:var(--soft);font-size:15px}
.icon-btn{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:50%;font-size:20px;color:var(--soft)}
.back{font-size:15px;color:var(--soft);min-height:44px;display:inline-flex;align-items:center}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:var(--sheet);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs a{flex:1;max-width:124px;text-align:center;text-decoration:none;color:var(--soft);padding:9px 0 8px;font-size:13px}
nav.tabs a span{display:block;font-size:20px;line-height:1.3}
nav.tabs a[aria-current=page]{color:var(--blue);font-family:var(--display)}

/* 도장판 */
.card-board{background:var(--sheet);border:2px solid var(--ink);border-radius:14px 14px 14px 14px;padding:18px 12px 14px;position:relative}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;word-break:keep-all;text-align:center;font-size:13px;color:var(--soft);min-width:0;line-height:1.25}
.stamp .ring{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:27px;
  border:2px dashed var(--line);position:relative;
}
.stamp .ring i{font-style:normal;filter:grayscale(1);opacity:.45}
.stamp .ring b{font-family:var(--display);font-weight:400;font-size:19px;opacity:.5}
.stamp.on{color:var(--ink)}
.stamp.on .ring{
  border:3px solid var(--c);transform:rotate(var(--r,-6deg));
  box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 4px var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent);
}
.stamp.on .ring i,.stamp.on .ring b{filter:none;opacity:1;color:var(--c)}
.stamp .count{position:absolute;right:-5px;top:-5px;background:var(--c);color:var(--sheet);font-size:12px;font-family:var(--display);min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;transform:rotate(calc(var(--r,-6deg) * -1))}
.stamp.pressed .ring{animation:press .42s cubic-bezier(.2,1.5,.5,1)}
@keyframes press{0%{transform:scale(1.7) rotate(14deg);opacity:0}100%{transform:scale(1) rotate(var(--r,-6deg));opacity:1}}
.tally{grid-column:span 3;align-self:center;padding:0 10px;font-family:var(--display);font-size:19px;line-height:1.35}
.tally small{display:block;font-family:var(--body);font-size:14px;color:var(--soft)}

h2.sec{font-size:20px;margin:26px 0 10px}
.banner{background:var(--sheet);border:2px solid var(--blue);border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:15px}
.banner button{color:var(--blue);text-decoration:underline;margin-left:4px}

/* 기록 */
.list{display:flex;flex-direction:column;gap:10px}
.entry{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
}
.entry .em{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-family:var(--display)}
.entry .tx{flex:1;min-width:0}
.entry strong{display:block;font-weight:400;font-family:var(--display);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry small{display:block;color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry img{flex:none;width:52px;height:52px;object-fit:cover;border-radius:6px}
.day-head{font-size:15px;color:var(--soft);margin:18px 0 6px}
.day-head:first-child{margin-top:0}
.empty{text-align:center;padding:28px 16px;color:var(--soft);background:var(--sheet);border:1.5px dashed var(--line);border-radius:10px}
.empty button{display:inline-block;margin-top:10px}

.btn{min-height:46px;padding:0 18px;border-radius:10px;font-family:var(--display);font-size:17px;background:var(--blue);color:var(--on-blue);display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:none;color:var(--danger);border:1.5px solid var(--danger)}
.btn.wide{width:100%}

/* 생활 목록 */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spine{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:6px 10px 10px 6px;padding:11px 10px;min-width:0}
.spine span.e{font-size:22px;color:var(--c);font-family:var(--display)}
.spine div{min-width:0}
.spine strong{display:block;font-family:var(--display);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine small{color:var(--soft);font-size:13px}

/* 생활 상세 */
.life-head{background:var(--c);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
.life-head h1{font-size:26px}
.life-head .sums{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px}
.life-head .sums div{font-size:13px}
.life-head .sums b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2}

/* 달력 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h1{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--sheet);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.cal .dow{text-align:center;font-size:13px;color:var(--soft);padding:7px 0;border-bottom:1.5px solid var(--line)}
.cal .d{min-height:62px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:14px}
.cal .d:nth-child(7n){border-right:0}
.cal .d.blank{background:transparent}
.cal .d.today>span:first-child{background:var(--ink);color:var(--sheet);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.cal .d.sel{background:color-mix(in srgb,var(--blue) 18%,transparent);box-shadow:inset 0 0 0 2px var(--blue)}

.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:40px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dots em{font-style:normal;font-size:11px;color:var(--soft);line-height:8px}

/* 통계 */
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--sheet);margin-bottom:16px}
.seg button{flex:1;min-height:42px;font-size:15px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet);font-family:var(--display)}
.bars{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:13px}
.bar{display:grid;grid-template-columns:104px 1fr 30px;align-items:center;gap:8px;font-size:14px;text-decoration:none;color:inherit}
.bar .track{height:14px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:3px}
.bar .n{text-align:right;font-family:var(--display)}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot div{background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--soft)}
.tot b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--c);line-height:1.3}

/* 입력 */
.search{width:100%;min-height:48px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);margin-bottom:14px;font-size:16px}
dialog{border:0;padding:0;background:var(--sheet);color:var(--ink);width:100%;max-width:560px;max-height:100dvh;height:100dvh;margin:0 auto}
dialog::backdrop{background:rgba(70,45,25,.45)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px 16px;background:var(--c);color:#fff;flex:none}
.dlg-head h2{flex:1;font-size:20px;min-width:0}
.dlg-head .icon-btn{color:inherit}
.dlg-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.dlg-foot{flex:none;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);border-top:1.5px solid var(--line);display:flex;gap:8px}
.dlg-foot .btn{flex:1}
.fld{margin-bottom:16px;border:0;padding:0}
.fld>label,.fld>legend{display:block;font-size:15px;margin-bottom:5px;padding:0;color:var(--soft)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld textarea{
  width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:transparent;font-size:16px;
}
.fld textarea{min-height:104px;resize:vertical;line-height:1.7}
.fld textarea.code{font-family:var(--mono);font-size:14px;line-height:1.5;white-space:pre;overflow:auto}
.unit{display:flex;align-items:center;gap:8px}
.unit span{color:var(--soft);flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 13px;border:1.5px solid var(--line);border-radius:20px;font-size:15px}
.dlg .chip[aria-pressed=true]{background:var(--c);color:#fff}
@media (prefers-color-scheme:dark){.dlg .chip[aria-pressed=true]{color:#2B2018}}
.rate{display:flex;gap:2px}
.rate button{width:44px;height:44px;font-size:26px;color:var(--line)}
.rate button[aria-pressed=true]{color:var(--c)}
.pics{display:flex;flex-wrap:wrap;gap:8px}
.pic{position:relative;width:84px;height:84px}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pic button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:15px}
.add-pic{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--soft);font-size:14px;cursor:pointer;text-align:center}
.err{color:var(--danger);font-size:15px;min-height:1px}
.ask{background:color-mix(in srgb,var(--danger) 10%,transparent);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:15px}

.view-row{margin-bottom:13px}
.view-row dt{font-size:14px;color:var(--soft)}
.view-row dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.view-row dd.code{font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--paper);padding:10px;border-radius:8px;overflow:auto;white-space:pre}
.view-pics{display:grid;gap:8px;margin-top:6px}
.view-pics img{width:100%;border-radius:8px}

.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:20;
  background:var(--ink);color:var(--sheet);padding:10px 15px;border-radius:10px;font-size:15px;display:flex;gap:13px;align-items:center;max-width:calc(100vw - 32px);width:max-content;
}
.toast button{text-decoration:underline;color:inherit}
.set-sec{background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.set-sec h2{font-size:18px;margin-bottom:5px}
.set-sec p{font-size:15px;color:var(--soft);margin-bottom:10px}
.set-sec .row{display:flex;gap:8px;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* 말랑한 노랑 화면: 선을 없애고 둥글고 넉넉하게 */
[data-theme=butter] body{background-image:none}
[data-theme=butter] .app{padding-left:20px;padding-right:20px}
[data-theme=butter] .top{margin-bottom:22px}
[data-theme=butter] .card-board{border:0;border-radius:32px;padding:24px 16px 26px}
[data-theme=butter] .board{grid-template-columns:repeat(3,1fr);gap:22px 6px}
[data-theme=butter] .tally{grid-column:1/-1;padding:0 6px 4px;text-align:center}
[data-theme=butter] .stamp{font-size:14px}
[data-theme=butter] .stamp .ring{width:78px;height:78px;font-size:34px;border:0;background:var(--paper)}
[data-theme=butter] .stamp:not(.on) .ring i{opacity:.5}
[data-theme=butter] .stamp.on .ring{border:0;box-shadow:0 0 0 4px var(--c);background:color-mix(in srgb,var(--c) 16%,var(--sheet));transform:rotate(calc(var(--r,-6deg) * .6))}
[data-theme=butter] .banner{border:0;border-radius:20px;padding:13px 16px}
[data-theme=butter] h2.sec{margin:30px 4px 12px}
[data-theme=butter] .list{gap:12px}
[data-theme=butter] .entry{border:0;border-radius:24px;padding:14px}
[data-theme=butter] .entry .em{width:48px;height:48px}
[data-theme=butter] .entry img{border-radius:14px}
[data-theme=butter] .empty{border:0;border-radius:24px;padding:34px 18px}
[data-theme=butter] .btn{min-height:52px;border-radius:26px}
[data-theme=butter] .spine{border:0;border-radius:22px;padding:13px 12px}
[data-theme=butter] .shelf{gap:12px}
[data-theme=butter] .life-head{background:color-mix(in srgb,var(--c) 18%,var(--sheet));color:var(--ink);border-radius:28px;padding:20px}
[data-theme=butter] .life-head .sums b{color:var(--c)}
[data-theme=butter] .cal{border:0;border-radius:28px;padding:10px 6px}
[data-theme=butter] .cal .dow{border:0}
[data-theme=butter] .cal .d{min-height:66px;border:0;border-radius:16px;padding-top:6px}
[data-theme=butter] .cal .d.sel{background:var(--paper);box-shadow:none}
[data-theme=butter] .seg{border:0;border-radius:26px;padding:4px}
[data-theme=butter] .seg button{border-radius:22px}
[data-theme=butter] .seg button[aria-pressed=true]{background:var(--blue);color:var(--on-blue)}
[data-theme=butter] .bars{border:0;border-radius:24px;padding:18px 16px;gap:12px}
[data-theme=butter] .bar .track{border-radius:8px;background:var(--paper)}
[data-theme=butter] .bar .fill{border-radius:8px}
[data-theme=butter] .tot{gap:12px}
[data-theme=butter] .tot div{border:0;border-radius:22px;padding:14px 16px}
[data-theme=butter] .search{border:0;border-radius:26px;padding:0 20px;min-height:52px}
[data-theme=butter] .set-sec{border:0;border-radius:24px;padding:18px}
[data-theme=butter] .dlg-head{background:color-mix(in srgb,var(--c) 18%,var(--sheet));color:var(--ink);padding-left:20px}
[data-theme=butter] .dlg-body{padding:20px}
[data-theme=butter] .dlg-foot{border-top:0}
[data-theme=butter] .fld{margin-bottom:20px}
[data-theme=butter] .fld input[type=text],[data-theme=butter] .fld input[type=number],[data-theme=butter] .fld input[type=date],[data-theme=butter] .fld textarea{border:0;background:var(--paper);border-radius:16px;padding:12px 14px}
[data-theme=butter] .chip{border:0;background:var(--paper);min-height:42px;border-radius:21px}
[data-theme=butter] .add-pic{border:0;background:var(--paper);border-radius:16px}
[data-theme=butter] .pic img{border-radius:16px}
[data-theme=butter] .toast{border-radius:22px;padding:12px 18px}
@media (max-width:959px){[data-theme=butter] nav.tabs{border-top:0;border-radius:26px 26px 0 0;box-shadow:0 -6px 22px rgba(107,74,50,.1)}[data-theme=butter] nav.tabs a[aria-current=page]{color:var(--blue)}}
@media (max-width:370px){[data-theme=butter] .stamp .ring{width:66px;height:66px;font-size:28px}}
@media (prefers-color-scheme:dark){.life-head,.dlg-head{color:#141A33}[data-theme=butter] .life-head,[data-theme=butter] .dlg-head{color:var(--ink)}}
/* 파랑 도장판: 4칸, 합계는 맨 뒤 */
.tally{order:99;grid-column:span 2}
[data-theme=butter] .tally{order:0}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-opt{padding:12px;border-radius:14px;border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:8px;font-family:var(--display);font-size:16px}
.theme-opt[aria-pressed=true]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.theme-opt small{font-family:var(--body);font-size:13px;color:var(--soft)}
.swatch{display:flex;align-items:center;justify-content:center;gap:8px;height:68px;border-radius:10px}
.swatch i{width:34px;height:34px;border-radius:50%;display:block}
@media (min-width:720px){
  dialog{height:min(760px,92dvh);margin:auto;border-radius:28px;overflow:hidden}
}
@media (min-width:960px){
  .app{margin-left:calc(50% - 250px);max-width:620px}
  nav.tabs{top:0;right:auto;left:calc(50% - 400px);bottom:auto;width:130px;flex-direction:column;justify-content:center;background:transparent;border:0;box-shadow:none;border-radius:0;height:100dvh;gap:6px}
  nav.tabs a{flex:none;max-width:none;display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:16px;text-align:left}
  .toast{bottom:24px}
}
@media (max-width:370px){
  .stamp .ring{width:56px;height:56px;font-size:23px}
  .stamp{font-size:12px}

LIVES.forEach(l=>l.fields.forEach(x=>{ if(!x.type) x.type='text'; }));

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const DOW = ['일','월','화','수','목','금','토'];
const longDate = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const tilt = id => [-9,5,-4,8,-6,3,-8,6,-3,9,-5,4,7,-7][LIVES.findIndex(l=>l.id===id)];
const lifeVars = l => `--c:${l.c};--cd:${l.cd}`;
const glyph = (l,tag='i') => l.text ? `<b>${l.e}</b>` : `<${tag}>${l.e}</${tag}>`;
const titleOf = e => { const l = LIFE[e.life]; return l.title(e.data) || l.name; };
const subOf = e => (LIFE[e.life].sub(e.data)||[]).filter(Boolean).join(', ');

/* ---------- 저장소 (IndexedDB, 사진까지 저장) ---------- */
let db = null, entries = [], meta = {}, memoryOnly = false;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('saenghwal-dojang',1);
    r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('entries',{keyPath:'id'}); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (store,mode,fn) => new Promise((res,rej)=>{
  const t = db.transaction(store,mode); const out = fn(t.objectStore(store));
  t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
});
async function putEntry(e){ if(db) await tx('entries','readwrite',s=>s.put(e)); }
async function delEntry(e){ if(db) await tx('entries','readwrite',s=>s.delete(e.id)); }
async function setMeta(k,v){ meta[k]=v; if(db) await tx('meta','readwrite',s=>s.put(v,k)); }
const THEMES = {butter:{name:'말랑 노랑',note:'둥글고 넉넉한 화면',bg:'#FFF1C4',a:'#6B4A32',b:'#FFFBEE'},
  classic:{name:'도장판 파랑',note:'모눈종이와 도장 4칸',bg:'#EEF2FA',a:'#2B3FD6',b:'#1B2450'}};
function applyTheme(t){
  if(!THEMES[t]) t = 'butter';
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{
    const dark = (m.media||'').includes('dark');
    m.content = t==='butter'?(dark?'#2B2018':'#FFF1C4'):(dark?'#161C36':'#EEF2FA');
  });
  try{ localStorage.setItem('saenghwal-theme',t); }catch(err){}
}
async function boot(){
  try{
    db = await openDB();
    entries = await tx('entries','readonly',s=>s.getAll());
    const keys = await tx('meta','readonly',s=>s.getAllKeys());
    for(const k of keys) meta[k] = await tx('meta','readonly',s=>s.get(k));
    navigator.storage?.persist?.();
  }catch(err){ db=null; memoryOnly=true; }
  applyTheme(meta.theme||document.documentElement.dataset.theme);
  addEventListener('hashchange',()=>{ path = location.hash.replace(/^#\/?/,''); render(); });
  addEventListener('popstate',()=>{ path = location.hash.replace(/^#\/?/,''); render(); });
  render();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
const needInstall = () => /iP(hone|ad|od)/.test(navigator.userAgent) && !navigator.standalone;
const sorted = es => [...es].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
const of = (life,es=entries) => es.filter(e=>e.life===life);
const streak = () => {
  const days = new Set(entries.map(e=>e.date)); const d = new Date();
  if(!days.has(ymd(d))) d.setDate(d.getDate()-1);
  let n=0; while(days.has(ymd(d))){ n++; d.setDate(d.getDate()-1); } return n;
};

/* ---------- 화면 ---------- */
const NAV = [['','🐾','오늘'],['cal','🗓','달력'],['lives','🗂','생활'],['stats','📊','통계'],['search','🔍','찾기']];
const ui = {month:null,sel:null,range:'month',q:'',pressed:null};
let path = location.hash.replace(/^#\/?/,'');
const route = () => path.split('/');
function go(p){ path = p; try{ history.pushState(null,'','#/'+p); }catch(err){} render(); scrollTo(0,0); }

function render(){
  const [v,arg] = route(); const m = $('#main');
  $('#tabs').innerHTML = NAV.map(([p,i,t])=>`<a href="#/${p}" ${(v||'')===p||(p==='lives'&&v==='life')?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${t}</a>`).join('');
  m.innerHTML = v==='cal'?calView() : v==='lives'?livesView() : v==='life'&&LIFE[arg]?lifeView(LIFE[arg]) : v==='stats'?statsView()
    : v==='search'?searchView() : v==='set'?setView() : todayView();
  ui.pressed = null;
  if(v==='search') searchResults();
}
const entryRow = (e,showDate) => { const l = LIFE[e.life];
  return `<button class="entry tint" style="${lifeVars(l)}" data-act="view" data-id="${e.id}">
    <span class="em" aria-hidden="true">${l.text?l.e.slice(0,1):l.e}</span>
    <span class="tx"><strong>${h(titleOf(e))}</strong><small>${showDate?h(longDate(e.date))+(subOf(e)?', ':''):''}${h(subOf(e))||(!showDate?h(l.name):'')}</small></span>
    ${e.photos?.[0]?`<img src="${e.photos[0]}" alt="">`:''}</button>`; };
const shortName = l => l.name.replace('생활','').replace('아이패드그림','아이패드 그림');
const stampBtn = (l,n) => `<button class="stamp tint ${n?'on':''} ${ui.pressed===l.id?'pressed':''}" style="${lifeVars(l)};--r:${tilt(l.id)}deg" data-act="new" data-life="${l.id}" aria-label="${l.name} 기록하기${n?`, 오늘 ${n}개 기록함`:''}">

const dlg = $('#dlg');
let draft = null, dirty = false;
function openEditor(life,date,entry){
  draft = entry ? structuredClone(entry) : {id:null,life,date:date||today(),data:{},photos:[]};
  dirty = false; drawEditor(); if(!dlg.open) dlg.showModal(); dlg.querySelector('.dlg-body').scrollTop = 0;
}
function fieldHTML(x,d){
  const v = d[x.key]; const id = 'f_'+x.key;
  if(x.type==='chips'||x.type==='multi'){
    const sel = x.type==='multi'?(v||[]):[v];
    return `<fieldset class="fld"><legend>${x.label}</legend><div class="chips">${x.options.map(o=>`<button type="button" class="chip" data-act="chip" data-k="${x.key}" data-v="${h(o)}" data-m="${x.type==='multi'?1:0}" aria-pressed="${sel.includes(o)}">${h(o)}</button>`).join('')}</div></fieldset>`;
  }
  if(x.type==='rate'){
    return `<fieldset class="fld"><legend>${x.label}</legend><div class="rate">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-k="${x.key}" data-n="${n}" aria-label="${n}점" aria-pressed="${n<=(v||0)}">★</button>`).join('')}</div></fieldset>`;
  }
  if(x.type==='area') return `<div class="fld"><label for="${id}">${x.label}</label><textarea id="${id}" data-k="${x.key}" class="${x.code?'code':''}" ${x.code?'spellcheck="false" autocapitalize="off"':''} rows="${x.short?3:7}" placeholder="${h(x.ph||'')}">${h(v)}</textarea></div>`;
  const input = `<input id="${id}" data-k="${x.key}" type="${x.type==='number'?'number':'text'}" ${x.type==='number'?'inputmode="decimal" min="0" step="any"':''} value="${h(v)}" placeholder="${h(x.ph||'')}">`;
  return `<div class="fld"><label for="${id}">${x.label}</label>${x.unit?`<div class="unit">${input}<span>${x.unit}</span></div>`:input}</div>`;
}
function fieldsHTML(l,d){
  let out='',pend=null;
  for(const x of l.fields){
    if(x.half){ if(pend){ out+=`<div class="pair">${fieldHTML(pend,d)}${fieldHTML(x,d)}</div>`; pend=null; } else pend=x; continue; }
    if(pend){ out+=fieldHTML(pend,d); pend=null; }
    out+=fieldHTML(x,d);
  }
  return out + (pend?fieldHTML(pend,d):'');
}
function drawEditor(ask){
  const l = LIFE[draft.life], d = draft.data, scroll = dlg.querySelector('.dlg-body')?.scrollTop||0;
  dlg.innerHTML = `<div class="dlg tint" style="${lifeVars(l)}">

    ${ask?`<div class="ask">작성 중인 내용이 있어요. 버릴까요?</div>`:''}

      ${draft.photos.map((p,i)=>`<div class="pic"><img src="${p}" alt="첨부 사진 ${i+1}"><button data-act="rm-pic" data-i="${i}" aria-label="사진 ${i+1} 빼기">✕</button></div>`).join('')}

  dlg.querySelector('.dlg-body').scrollTop = scroll;

async function saveDraft(){
  const has = draft.photos.length || Object.values(draft.data).some(v=>Array.isArray(v)?v.length:String(v??'').trim());
  if(!has){ $('#err').textContent = '내용을 한 칸 이상 채워 주세요.'; return; }
  if(!draft.date){ $('#err').textContent = '날짜를 골라 주세요.'; return; }
  const now = Date.now(), isNew = !draft.id;
  const e = {...draft, id:draft.id||uid(), createdAt:draft.createdAt||now, updatedAt:now};
  try{ await putEntry(e); }catch(err){ $('#err').textContent = '저장 공간이 부족해요. 오래된 사진을 지워 주세요.'; return; }
  entries = entries.filter(x=>x.id!==e.id); entries.push(e);
  dirty=false; dlg.close(); if(isNew && e.date===today()) ui.pressed = e.life;
  render(); toast(isNew?'기록을 저장했어요':'수정한 내용을 저장했어요');
}
function viewEntry(id){
  const e = entries.find(x=>x.id===id); if(!e) return; const l = LIFE[e.life];
  const rows = l.fields.map(x=>{ let v=e.data[x.key]; if(Array.isArray(v)) v=join(v); if(!v) return '';
    if(x.type==='rate') v=star(v); else if(x.unit) v=`${v}${x.unit}`;
    return `<div class="view-row"><dt>${x.label}</dt><dd class="${x.code?'code':''}">${h(v)}</dd></div>`; }).join('');
  dlg.innerHTML = `<div class="dlg tint" style="${lifeVars(l)}">
   <div class="dlg-head"><h2>${h(titleOf(e))}</h2><button class="icon-btn" data-act="close-view" aria-label="닫기">✕</button></div>
   <div class="dlg-body"><p style="color:var(--soft);margin-bottom:12px">${l.name}, ${longDate(e.date)}</p><dl>${rows}</dl>
    ${e.photos.length?`<div class="view-pics">${e.photos.map((p,i)=>`<img src="${p}" alt="첨부 사진 ${i+1}">`).join('')}</div>`:''}</div>
   <div class="dlg-foot"><button class="btn danger" data-act="del" data-id="${e.id}">지우기</button><button class="btn" data-act="edit" data-id="${e.id}">수정하기</button></div></div>`;

function pickLife(day){
  dlg.innerHTML = `<div class="dlg tint" style="--c:var(--blue);--cd:var(--blue)"><div class="dlg-head"><h2>${longDate(day)}, 어떤 생활인가요?</h2><button class="icon-btn" data-act="close-view" aria-label="닫기">✕</button></div>

async function shrink(file){
  const img = await createImageBitmap(file).catch(()=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);}));
  const k = Math.min(1,1280/Math.max(img.width,img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.78);
}
let toastT;
function toast(msg,undo){
  const b = $('#toastBox'); b.innerHTML = `<div class="toast"><span>${h(msg)}</span>${undo?'<button id="undo">되돌리기</button>':''}</div>`;
  if(undo) $('#undo').onclick = () => { undo(); b.innerHTML=''; };
  clearTimeout(toastT); toastT = setTimeout(()=>b.innerHTML='',undo?6000:2600);
}

/* ---------- 백업 ---------- */
async function exportData(){
  const blob = new Blob([JSON.stringify({app:'saenghwal-dojang',version:1,exportedAt:new Date().toISOString(),entries})],{type:'application/json'});
  const name = `생활도장-백업-${today()}.json`, file = new File([blob],name,{type:'application/json'});
  if(navigator.canShare?.({files:[file]})){
    try{ await navigator.share({files:[file]}); }catch(err){ if(err.name==='AbortError') return; toast('백업 파일을 저장하지 못했어요. 다시 시도해 주세요.'); return; }
  }else{
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
  await setMeta('lastBackup',Date.now()); render(); toast('백업 파일을 저장했어요');
}
async function importData(file){
  try{
    const j = JSON.parse(await file.text());
    if(j.app!=='saenghwal-dojang'||!Array.isArray(j.entries)) throw 0;
    let n=0;
    for(const e of j.entries){
      if(!e.id||!LIFE[e.life]||!/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')) continue;
      const cur = entries.find(x=>x.id===e.id);
      if(cur && (cur.updatedAt||0)>=(e.updatedAt||0)) continue;
      const clean = {id:e.id,life:e.life,date:e.date,data:e.data||{},photos:(e.photos||[]).filter(p=>/^data:image\//.test(p)),createdAt:e.createdAt||Date.now(),updatedAt:e.updatedAt||Date.now()};
      await putEntry(clean); entries = entries.filter(x=>x.id!==e.id); entries.push(clean); n++;
    }
    render(); toast(n?`기록 ${n}개를 불러왔어요`:'새로 불러올 기록이 없어요');
  }catch(err){ toast('생활도장 백업 파일이 아니에요. 파일을 다시 골라 주세요.'); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async ev=>{
  const link = ev.target.closest('a[href^="#/"]');
  if(link){ ev.preventDefault(); go(link.getAttribute('href').slice(2)); return; }
  const t = ev.target.closest('[data-act]'); if(!t) return; const a = t.dataset.act;
  if(a==='new') openEditor(t.dataset.life,t.dataset.day);
  else if(a==='view') viewEntry(t.dataset.id);
  else if(a==='edit') openEditor(null,null,entries.find(x=>x.id===t.dataset.id));
  else if(a==='close-view') dlg.close();
  else if(a==='close'){ dirty?drawEditor(true):dlg.close(); }
  else if(a==='keep') drawEditor();
  else if(a==='discard'){ dirty=false; dlg.close(); }
  else if(a==='save') saveDraft();
  else if(a==='chip'){ const {k,v,m}=t.dataset, d=draft.data;
    if(m==='1'){ const s=new Set(d[k]||[]); s.has(v)?s.delete(v):s.add(v); d[k]=[...s]; } else d[k]= d[k]===v?'':v;
    dirty=true; drawEditor(); dlg.querySelector(`[data-k="${k}"][data-v="${CSS.escape(v)}"]`)?.focus(); }
  else if(a==='rate'){ const k=t.dataset.k,n=+t.dataset.n; draft.data[k]= draft.data[k]===n?0:n; dirty=true; drawEditor(); }
  else if(a==='rm-pic'){ draft.photos.splice(+t.dataset.i,1); dirty=true; drawEditor(); }
  else if(a==='del'){ const e=entries.find(x=>x.id===t.dataset.id); entries=entries.filter(x=>x!==e); await delEntry(e); dlg.close(); render();
    toast('기록을 지웠어요',async()=>{ entries.push(e); await putEntry(e); render(); }); }
  else if(a==='mon'){ let [y,m]=ui.month; m+=+t.dataset.d; if(m<0){m=11;y--} if(m>11){m=0;y++} ui.month=[y,m]; render(); }
  else if(a==='pick-day'){ ui.sel=t.dataset.day; render(); }
  else if(a==='pick-life') pickLife(t.dataset.day);
  else if(a==='range'){ ui.range=t.dataset.r; render(); }
  else if(a==='export') exportData();
  else if(a==='theme'){ applyTheme(t.dataset.t); await setMeta('theme',t.dataset.t); render(); toast(`${THEMES[t.dataset.t].name} 디자인으로 바꿨어요`); }

});
document.addEventListener('input',ev=>{
  const t = ev.target;
  if(t.id==='q'){ ui.q=t.value; searchResults(); return; }
  if(!draft||!dlg.open) return;
  if(t.dataset.k){ draft.data[t.dataset.k]=t.value; dirty=true; }
  if('date' in t.dataset){ draft.date=t.value; dirty=true; }
});
document.addEventListener('change',async ev=>{
  const t = ev.target;
  if(t.id==='importFile'&&t.files[0]) importData(t.files[0]);
  if(t.id==='picInput'){
    const files=[...t.files].slice(0,4-draft.photos.length);
    for(const file of files){ try{ draft.photos.push(await shrink(file)); dirty=true; }catch(e){ toast('이 사진은 열 수 없어요. JPG나 PNG로 다시 골라 주세요.'); } }
    drawEditor();
  }
});
dlg.addEventListener('cancel',ev=>{ if(dirty){ ev.preventDefault(); drawEditor(true); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.matches('label.btn')) ev.target.click(); });
boot();
</script>
</body>
</html>
